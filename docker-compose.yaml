services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-room_booking}
      POSTGRES_USER: ${DB_USER:-room_booking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-room_booking}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-room_booking} -d ${DB_NAME:-room_booking}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  service:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      HTTP_PORT: ${HTTP_PORT:-8080}
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-room_booking}
      DB_USER: ${DB_USER:-room_booking}
      DB_PASSWORD: ${DB_PASSWORD:-room_booking}
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_TTL: ${JWT_TTL:-24h}
      ENABLE_DUMMY_LOGIN: ${ENABLE_DUMMY_LOGIN:-}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      SLOT_WINDOW_DAYS: ${SLOT_WINDOW_DAYS:-14}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"

volumes:
  postgres_data:
